# The Ratatui binding, in a workspace of its own (as GPUI's is), so its tree stays out of
# omarchy-ui's lock file. bin/build ratatui builds it into tui/ratatui/target.
[workspace]
resolver = "3"
members = ["omarchy-ratatui", "gallery"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Pinned exactly; move them together (docs/using-ratatui.md).
ratatui = { version = "=0.30.2" }
crossterm = { version = "=0.29.0" }
omarchy-theme = { path = "../../crates/omarchy-theme" }
omarchy-ansi = { path = "../../crates/omarchy-ansi" }

[profile.dev.package."*"]
opt-level = 2
