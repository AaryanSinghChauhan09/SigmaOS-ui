[project]
name = "omarchy-textual"
version = "0.1.0"
description = "Omarchy's look, live theme-following and component kit for Textual apps."
license = "MIT"
requires-python = ">=3.11"
# Pinned exactly; move them together (docs/using-textual.md).
dependencies = [
  "textual==8.2.8",
  "rich==15.0.0",
  "wcwidth==0.9.4",
]

[project.scripts]
omarchy-textual-gallery = "omarchy_textual.gallery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omarchy_textual"]
