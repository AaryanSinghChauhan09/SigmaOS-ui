[package]
name = "omarchy-theme"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Resolve and watch the active Omarchy theme as framework-neutral design tokens."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", default-features = false }

[[bin]]
name = "omarchy-theme"
path = "src/main.rs"
