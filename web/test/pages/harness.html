<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>harness</title>
<style>html, body { margin: 0; } body { background: var(--omarchy-background); padding: 16px; }</style>
<script type="module">
  import * as kit from "../../src/index.js";
  window.kit = kit;
  // Every event an element emits, for the tests: window.events = [[tag, type, detail], …]
  window.events = [];
  for (const type of ["change", "input", "click", "trigger", "accept", "reject", "activate", "toggle", "pick", "select", "delete", "close", "open", "action", "sort", "expand", "collapse", "dismiss", "navigate", "seek", "trim", "move", "drop", "crop", "query", "overflow", "resize", "month", "press", "release", "nudge", "move-request", "clip-press", "view-change"])
    document.addEventListener(type, (e) => {
      const t = e.target;
      if (t && t.tagName && t.tagName.startsWith("OMARCHY-")) window.events.push([t.tagName.toLowerCase(), type, e.detail ?? null]);
    }, true);
  window.harnessReady = true;
</script>
</head>
<body></body>
</html>
