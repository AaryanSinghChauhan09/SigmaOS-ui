[package]
name = "omarchy-tauri-gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The web gallery (web/gallery) in a Tauri app on WebKitGTK, for bin/review and the Tauri tests."

[dependencies]
tauri = { workspace = true, features = ["custom-protocol"] }
tauri-plugin-omarchy = { path = "../plugin", features = ["snap"] }
serde_json = "1"

[build-dependencies]
tauri-build = { workspace = true }
