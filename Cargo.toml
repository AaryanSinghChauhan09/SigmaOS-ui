[workspace]
resolver = "3"
members = [
    "crates/omarchy-theme",
    "crates/omarchy-theme-ffi",
    "rune/omarchy-rune",
    "rune/gallery",
]
# Built as an app outside the workspace would be (bin/test-examples).
exclude = ["examples/rune"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Rune is pre-release and asks apps to pin a rev of `dev`, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }
omarchy-theme = { path = "crates/omarchy-theme" }

[profile.dev.package."*"]
opt-level = 2
