[package]
name = "omarchy-gtk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Omarchy UI for gtk4-rs: the live Omarchy theme and the component kit, bound from libomarchy-gtk-1"
links = "omarchy-gtk-1"

# Not a member of the repository's root workspace: it binds the C library, built by gtk/build.
[workspace]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
glib = "0.22"

[build-dependencies]
pkg-config = "0.3"
