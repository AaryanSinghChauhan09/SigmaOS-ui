<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omarchy UI Review</title>
<style>
  :root {
    --bg: #101315; --panel: #171b1e; --fg: #cacccc; --dim: #7d8488; --line: #2a3034;
    --accent: #7aa2f7; --bad: #f7768e; --ok: #9ece6a; --warn: #e0af68;
    --mono: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f4f4f2; --panel: #ffffff; --fg: #222426; --dim: #6b7074; --line: #d9dbdc; --accent: #2f5fd0; --bad: #c4314b; --ok: #3d7a1c; --warn: #a06800; }
  }
  :root[data-theme="light"] { --bg: #f4f4f2; --panel: #ffffff; --fg: #222426; --dim: #6b7074; --line: #d9dbdc; --accent: #2f5fd0; --bad: #c4314b; --ok: #3d7a1c; --warn: #a06800; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { font-size: 14px; margin: 0 0 8px; font-weight: 700; }
  h1 span { color: var(--dim); font-weight: 400; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .group b { color: var(--dim); font-weight: 400; margin-right: 4px; }
  button.chip { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; }
  button.chip:hover { border-color: var(--dim); }
  button.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  main { padding: 16px; display: grid; gap: 16px; }
  .parity { border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
  .parity.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
  .parity.bad { border-color: var(--bad); }
  .parity summary { cursor: pointer; }
  .parity pre { white-space: pre-wrap; color: var(--dim); margin: 8px 0 0; max-height: 240px; overflow: auto; }
  .card { border: 1px solid var(--line); background: var(--panel); }
  .card h2 { display: flex; gap: 12px; align-items: baseline; font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .card h2 .meta { color: var(--dim); font-weight: 400; }
  .card h2 .score { margin-left: auto; font-weight: 400; }
  .score.good { color: var(--ok); } .score.mid { color: var(--warn); } .score.high { color: var(--bad); }
  .body { padding: 12px; overflow-x: auto; }
  .pair { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; }
  .pair figure { margin: 0; min-width: 0; }
  figcaption { color: var(--dim); margin-bottom: 4px; }
  figcaption .score { margin-left: 8px; }
  .missing { color: var(--dim); border: 1px dashed var(--line); padding: 24px; text-align: center; }
  img { display: block; max-width: 100%; height: auto; image-rendering: auto; }
  .stage { position: relative; display: inline-block; max-width: 100%; }
  .stage img.top { position: absolute; inset: 0; }
  .stage .clip { position: absolute; inset: 0; overflow: hidden; }
  .stage .clip img { max-width: none; }
  .stage .rule { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); pointer-events: none; }
  input[type=range] { width: 260px; accent-color: var(--accent); }
  .slider { display: flex; gap: 8px; align-items: center; color: var(--dim); margin-bottom: 8px; }
  .diffbg { background: repeating-conic-gradient(#0000 0 25%, #8881 0 50%) 0 / 16px 16px; }
  .err { color: var(--bad); white-space: pre-wrap; }
  .empty { color: var(--dim); padding: 24px; text-align: center; }
  .term { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .term figure { margin: 0; }
  .term > h3 { font-size: 13px; margin: 0 0 8px; font-weight: 700; }
  .term > h3 span { color: var(--dim); font-weight: 400; }
  .note { color: var(--dim); margin-bottom: 8px; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } input[type=range] { width: 160px; } }
  main img { cursor: zoom-in; }
  .zoom { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--bg); }
  .zoom[hidden] { display: none; }
  .zoom-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .zoom-cap { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zoom-cap span { color: var(--dim); }
  .zoom-view { flex: 1; overflow: auto; cursor: grab; touch-action: pan-x pan-y pinch-zoom; }
  .zoom-view.dragging { cursor: grabbing; }
  .zoom-view:focus { outline: none; }
  .zoom-inner { display: grid; place-items: center; min-width: 100%; min-height: 100%; width: max-content; padding: 16px; }
  .zoom img { max-width: none; }
  .zoom.pixels img { image-rendering: pixelated; }
  .zoom .stage { max-width: none; }
  .zoom-hint { color: var(--dim); }
  @media (max-width: 720px) { .zoom-hint { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Omarchy UI review <span id="sub"></span></h1>
  <div class="controls">
    <div class="group" id="f-theme"><b>theme</b></div>
    <div class="group" id="f-radius"><b>radius</b></div>
    <div class="group" id="f-section"><b>section</b></div>
    <div class="group" id="f-mode"><b>view</b></div>
    <div class="group" id="f-against"><b>against</b></div>
    <div class="group" id="f-tagainst"><b>against (terminal)</b></div>
  </div>
</header>
<main id="main"></main>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Zoomed screenshot">
  <div class="zoom-bar">
    <div class="zoom-cap" id="zoom-cap"></div>
    <div class="group" id="zoom-levels"></div>
    <div class="group">
      <button class="chip" id="zoom-prev" title="Previous (←)">◀</button>
      <span id="zoom-pos" class="zoom-hint"></span>
      <button class="chip" id="zoom-next" title="Next (→)">▶</button>
      <button class="chip" id="zoom-close" title="Close (Esc)">close</button>
    </div>
    <span class="zoom-hint">drag to pan · + − 0 zoom · ← → step · Esc close</span>
  </div>
  <div class="zoom-view" id="zoom-view" tabindex="-1"><div class="zoom-inner" id="zoom-inner"></div></div>
</div>
<script>
const DATA = /*DATA*/null;
// One column per binding in the registry (tools/bindings.d), the reference (Qt) first; every other
// binding is diffed against it.
const REF = DATA.bindings[0];
const OTHERS = DATA.bindings.slice(1);
const TITLE = Object.fromEntries(DATA.bindings.map(b => [b.name, b.title]));
const MODES = [["side", "side by side"], ["overlay", "overlay"], ["swipe", "swipe"], ["diff", "diff"]];
// The terminal family (spec/terminal.md), when the registry has one: its reference (Ratatui) first.
// Its bindings are compared only with each other; Qt is shown beside them to eyeball.
const TERM = DATA.terminal || [];
const TREF = TERM.length ? TERM[0] : null;
const TOTHERS = TERM.slice(1);
const TTITLE = Object.fromEntries(TERM.map(b => [b.name, b.title]));
const state = { theme: DATA.themes[0], radius: String(DATA.radii[0]), section: "all", mode: "side", against: OTHERS.length ? OTHERS[0].name : "", tagainst: TOTHERS.length ? TOTHERS[0].name : "" };
try { Object.assign(state, JSON.parse(localStorage.getItem("omarchy-ui-review") || "{}")); } catch (e) {}
if (!DATA.themes.includes(state.theme)) state.theme = DATA.themes[0];
if (!OTHERS.some(b => b.name === state.against)) state.against = OTHERS.length ? OTHERS[0].name : "";
if (!TOTHERS.some(b => b.name === state.tagainst)) state.tagainst = TOTHERS.length ? TOTHERS[0].name : "";

function save() { try { localStorage.setItem("omarchy-ui-review", JSON.stringify(state)); } catch (e) {} }

function chips(id, key, options) {
  const g = document.getElementById(id);
  g.querySelectorAll("button").forEach(b => b.remove());
  g.style.display = options.length ? "" : "none";
  for (const [value, label] of options) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(state[key] === value));
    b.onclick = () => { state[key] = value; save(); render(); };
    g.appendChild(b);
  }
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}

function img(src, w, cls = "") { return el("img", { src, width: w, alt: "", class: cls, loading: "lazy" }); }

function scoreClass(s) { return s == null ? "" : s < 2 ? "good" : s < 6 ? "mid" : "high"; }

function src(row, key) { return row.images[key] ? row.path + "/" + row.images[key] : null; }

// What one binding shows for a row: its image, or why there's none.
function cell(row, name) {
  const s = src(row, name);
  if (s) return img(s, row.w);
  if (row.missing.includes(name)) return el("div", { class: "missing" }, "not in this binding");
  return el("div", { class: "err" }, row.errors[name] || "not rendered");
}

function view(row) {
  const against = state.against;
  if (state.mode === "side" || !against) {
    const pair = el("div", { class: "pair" });
    pair.style.setProperty("--cols", String(DATA.bindings.length));
    for (const b of DATA.bindings) {
      const d = row.diffs[b.name];
      const cap = el("figcaption", {}, b.title);
      if (!b.reference && d != null) cap.append(el("span", { class: "score " + scoreClass(d) }, `${d}% vs ${REF.title}`));
      pair.append(el("figure", {}, cap, cell(row, b.name)));
    }
    return pair;
  }
  const ref = src(row, REF.name), other = src(row, against), diff = src(row, "diff-" + against);
  if (!other) return el("div", {}, el("figcaption", {}, TITLE[against]), cell(row, against));
  if (state.mode === "diff") {
    return el("figure", {}, el("figcaption", {}, `${TITLE[against]}: pixels that differ from ${REF.title} by more than 3%, over ${REF.title}`),
      el("div", { class: "stage" }, img(ref, row.w), diff ? img(diff, row.w, "top") : ""));
  }
  const stage = el("div", { class: "stage" }, img(ref, row.w));
  const range = el("input", { type: "range", min: "0", max: "100", value: "50" });
  if (state.mode === "overlay") {
    const top = img(other, row.w, "top");
    top.style.opacity = 0.5;
    stage.append(top);
    range.oninput = () => { top.style.opacity = range.value / 100; };
    return el("div", {}, el("label", { class: "slider" }, REF.title, range, TITLE[against]), stage);
  }
  const clip = el("div", { class: "clip" }, img(other, row.w));
  const rule = el("div", { class: "rule" });
  const set = () => { clip.style.clipPath = `inset(0 0 0 ${range.value}%)`; rule.style.left = range.value + "%"; };
  range.oninput = set;
  set();
  stage.append(clip, rule);
  return el("div", {}, el("label", { class: "slider" }, REF.title + " ◀", range, "▶ " + TITLE[against]), stage);
}

// The terminal family's block under the GUI view: Qt to eyeball beside every terminal binding, or
// overlay / swipe / diff of a terminal binding against the terminal reference.
function tsrc(row, key) { return row.term.images[key] ? row.path + "/" + row.term.images[key] : null; }

function tscore(d) { return d.cells == null ? `${d.pixels}% pixels` : `${d.cells}% cells · ${d.pixels}% pixels`; }

function tcell(row, name) {
  const s = tsrc(row, name);
  if (s) return img(s, row.term.w);
  if (row.term.missing.includes(name)) return el("div", { class: "missing" }, "not in this binding");
  return el("div", { class: "err" }, row.term.errors[name] || "not rendered");
}

function termView(row) {
  const t = row.term;
  const head = el("h3", {}, "Terminal ", el("span", {}, t.cols ? `${t.cols} × ${t.rows} cells` : ""));
  if (t.errors[TREF.name]) return el("div", { class: "term" }, head, el("div", { class: "err" }, t.errors[TREF.name]));
  if (state.mode === "side") {
    const pair = el("div", { class: "pair" });
    pair.style.setProperty("--cols", String(TERM.length + 1));
    const qt = src(row, REF.name);
    pair.append(el("figure", {}, el("figcaption", {}, `${REF.title} (for reference)`), qt ? img(qt, row.w) : cell(row, REF.name)));
    for (const b of TERM) {
      const d = t.diffs[b.name];
      const cap = el("figcaption", {}, b.title);
      if (!b.reference && d) cap.append(el("span", { class: "score " + scoreClass(d.cells ?? d.pixels) }, `${tscore(d)} vs ${TREF.title}`));
      pair.append(el("figure", {}, cap, tcell(row, b.name)));
    }
    return el("div", { class: "term" }, head, pair);
  }
  const ref = tsrc(row, TREF.name);
  if (!TOTHERS.length) return el("div", { class: "term" }, head, el("div", { class: "note" }, "no other terminal binding to compare"), img(ref, t.w));
  const against = state.tagainst, other = tsrc(row, against);
  if (!other) return el("div", { class: "term" }, head, el("figcaption", {}, TTITLE[against]), tcell(row, against));
  const d = t.diffs[against] || {};
  if (state.mode === "diff") {
    const cells = tsrc(row, "diffcells-" + against);
    return el("div", { class: "term" }, head, el("figure", {}, el("figcaption", {}, `${TTITLE[against]}: cells that differ from ${TREF.title} (${d.cells}% of cells, ${d.pixels}% of pixels), over ${TREF.title}`),
      el("div", { class: "stage" }, img(ref, t.w), cells ? img(cells, t.w, "top") : "")));
  }
  const stage = el("div", { class: "stage" }, img(ref, t.w));
  const range = el("input", { type: "range", min: "0", max: "100", value: "50" });
  if (state.mode === "overlay") {
    const top = img(other, t.w, "top");
    top.style.opacity = 0.5;
    stage.append(top);
    range.oninput = () => { top.style.opacity = range.value / 100; };
    return el("div", { class: "term" }, head, el("label", { class: "slider" }, TREF.title, range, TTITLE[against]), stage);
  }
  const clip = el("div", { class: "clip" }, img(other, t.w));
  const rule = el("div", { class: "rule" });
  const set = () => { clip.style.clipPath = `inset(0 0 0 ${range.value}%)`; rule.style.left = range.value + "%"; };
  range.oninput = set;
  set();
  stage.append(clip, rule);
  return el("div", { class: "term" }, head, el("label", { class: "slider" }, TREF.title + " ◀", range, "▶ " + TTITLE[against]), stage);
}

// The terminal family's part of the header score, when it has diffs.
function termScore(row) {
  if (!row.term) return "";
  const errs = Object.keys(row.term.errors);
  if (errs.length) return "terminal failed: " + errs.map(n => TTITLE[n]).join(", ");
  const parts = TOTHERS.filter(b => row.term.diffs[b.name]);
  if (!parts.length) return "";
  return parts.map(b => `${b.title} ${tscore(row.term.diffs[b.name])}`).join(" · ") + ` vs ${TREF.title}`;
}

// The header's score: the one other binding's share as before, or each binding's.
function score(row) {
  const s = guiScore(row);
  const t = termScore(row);
  if (t) s.textContent = s.textContent ? `${s.textContent} · ${t}` : t;
  return s;
}

function guiScore(row) {
  const errs = Object.keys(row.errors);
  if (errs.length) return el("span", { class: "score high" }, "failed: " + errs.map(n => TITLE[n]).join(", "));
  const parts = OTHERS.filter(b => row.diffs[b.name] != null);
  if (!parts.length) return el("span", { class: "score" }, "");
  if (OTHERS.length === 1) {
    const s = row.diffs[OTHERS[0].name];
    return el("span", { class: "score " + scoreClass(s) }, `${s}% of pixels differ`);
  }
  const worst = Math.max(...parts.map(b => row.diffs[b.name]));
  return el("span", { class: "score " + scoreClass(worst) }, parts.map(b => `${b.title} ${row.diffs[b.name]}%`).join(" · ") + ` vs ${REF.title}`);
}

function parityPanel() {
  const own = Object.keys(DATA.parity);
  const bad = [];
  let total = 0;
  for (const name of own) {
    for (const [k, v] of Object.entries(DATA.parity[name])) {
      total++;
      if (v.length) bad.push([TITLE[name] + " " + k, v]);
    }
  }
  const direct = DATA.bindings.filter(b => !own.includes(b.name)).map(b => b.title);
  const tail = direct.length ? ` (${direct.join(", ")} read${direct.length === 1 ? "s" : ""} the core's tokens directly)` : "";
  const key = `${state.theme}@${state.radius}`;
  const here = own.reduce((n, name) => n + ((DATA.parity[name][key] || []).length), 0);
  return el("details", { class: "parity " + (bad.length ? "bad" : "ok") },
    el("summary", {}, bad.length
      ? `Token parity: ${bad.length} of ${total} binding × theme × radius dumps differ from the core (this one: ${here})`
      : `Token parity: ${own.map(n => TITLE[n]).join(", ") || "no binding"} resolve${own.length === 1 ? "s" : ""} the core's tokens for all ${total} theme × radius combinations${tail}`),
    el("pre", {}, bad.length ? bad.map(([k, v]) => k + "\n  " + v.join("\n  ")).join("\n")
      : "Every fixture theme, at every radius, dumps byte-identical canonical JSON from each binding and the core (omarchy-theme)."
        + (DATA.skipped.length ? "\n\nSkipped here: " + DATA.skipped.map(s => `${s.title} (${s.why})`).join(", ") : "")));
}

function render() {
  const live = DATA.live ? `live (${DATA.live})` : "live";
  chips("f-theme", "theme", DATA.themes.map(t => [t, t === "live" ? live : t]));
  chips("f-radius", "radius", DATA.radii.map(r => [String(r), r === 0 ? "0 (sharp)" : String(r)]));
  chips("f-section", "section", [["all", "all"], ...DATA.sections.map(s => [s, s])]);
  chips("f-mode", "mode", MODES);
  chips("f-against", "against", state.mode !== "side" && OTHERS.length > 1 ? OTHERS.map(b => [b.name, b.title]) : []);
  chips("f-tagainst", "tagainst", state.mode !== "side" && TOTHERS.length > 1 ? TOTHERS.map(b => [b.name, b.title]) : []);
  document.getElementById("sub").textContent = `· ${DATA.rev} · ` + DATA.bindings.map(b => b.title).join(" vs ")
    + (TERM.length ? " · terminal: " + TERM.map(b => b.title).join(" vs ") : "");

  const main = document.getElementById("main");
  main.replaceChildren();
  main.append(parityPanel());

  const rows = DATA.rows.filter(r => r.theme === state.theme && String(r.radius) === state.radius && (state.section === "all" || r.section === state.section));
  if (!rows.length) { main.append(el("div", { class: "empty" }, "Nothing rendered for this combination.")); return; }
  for (const row of rows) {
    const head = el("h2", {}, row.section, el("span", { class: "meta" }, `${row.theme} · radius ${row.radius}`), score(row));
    const body = el("div", { class: "body" }, row.errors[REF.name] ? el("div", { class: "err" }, row.errors[REF.name]) : view(row));
    if (TREF && row.term) body.append(termView(row));
    main.append(el("section", { class: "card" }, head, body));
  }
}

// Click a screenshot to zoom: the image, or the whole stage in overlay, swipe and diff views (as
// it is set), at Fit or 1× to 8× its page size, panned by dragging; ← → step through the page.
const zoom = (() => {
  const box = document.getElementById("zoom"), view = document.getElementById("zoom-view"), inner = document.getElementById("zoom-inner");
  const LEVELS = [["fit", "fit"], [1, "1×"], [2, "2×"], [4, "4×"], [8, "8×"]];
  let targets = [], at = -1, level = "fit";
  const targetOf = node => node.closest(".stage") || node;
  const baseWidth = t => {
    const i = t.matches("img") ? t : t.querySelector("img");
    return Number(i && i.getAttribute("width")) || (i ? i.naturalWidth / 2 : 0) || t.offsetWidth;
  };
  const baseHeight = t => {
    const i = t.matches("img") ? t : t.querySelector("img");
    const w = baseWidth(t);
    return i && i.naturalWidth ? w * i.naturalHeight / i.naturalWidth : t.offsetHeight * w / Math.max(1, t.offsetWidth);
  };
  function caption(t) {
    const card = t.closest(".card"), term = t.closest(".term");
    const fig = t.closest("figure");
    const words = (n, sep) => n ? [...n.childNodes].map(c => c.textContent.trim()).filter(Boolean).join(sep) : "";
    const cap = fig && fig.querySelector("figcaption") ? words(fig.querySelector("figcaption"), " ")
      : words(t.parentElement.querySelector(".slider"), " ↔ ");
    const where = card ? card.querySelector("h2").firstChild.textContent + " · " + card.querySelector("h2 .meta").textContent : "";
    return [cap, where + (term ? " · terminal" : "")];
  }
  function scale() {
    if (level !== "fit") return level;
    const t = targets[at], w = baseWidth(t), h = baseHeight(t);
    return Math.min((view.clientWidth - 32) / w, (view.clientHeight - 32) / h);
  }
  function show() {
    const t = targets[at];
    const copy = t.cloneNode(true);
    copy.removeAttribute("loading");
    const s = scale(), w = Math.round(baseWidth(t) * s);
    for (const i of copy.matches("img") ? [copy] : copy.querySelectorAll("img")) { i.removeAttribute("loading"); i.setAttribute("width", w); }
    inner.replaceChildren(copy);
    box.classList.toggle("pixels", s * devicePixelRatio > 2.01);
    const [cap, where] = caption(t);
    const capEl = document.getElementById("zoom-cap");
    capEl.replaceChildren(document.createTextNode(cap + " "), el("span", {}, where));
    document.getElementById("zoom-pos").textContent = `${at + 1} / ${targets.length}`;
    const levels = document.getElementById("zoom-levels");
    levels.replaceChildren(...LEVELS.map(([v, label]) => {
      const b = el("button", { class: "chip", "aria-pressed": String(level === v) }, label);
      b.onclick = () => set(v);
      return b;
    }));
  }
  function set(v) {
    // Keep the point in the middle of the view in the middle across zoom levels.
    const fx = (view.scrollLeft + view.clientWidth / 2) / Math.max(1, view.scrollWidth);
    const fy = (view.scrollTop + view.clientHeight / 2) / Math.max(1, view.scrollHeight);
    level = v; show();
    view.scrollLeft = fx * view.scrollWidth - view.clientWidth / 2;
    view.scrollTop = fy * view.scrollHeight - view.clientHeight / 2;
  }
  function step(d) { if (!targets.length) return; at = (at + d + targets.length) % targets.length; show(); view.scrollTo(0, 0); }
  function open(node) {
    const main = document.getElementById("main");
    targets = [...main.querySelectorAll(".stage, img")].filter(n => !n.closest(".stage") || n.matches(".stage"));
    at = Math.max(0, targets.indexOf(targetOf(node)));
    box.hidden = false; document.body.style.overflow = "hidden";
    show(); view.focus();
  }
  function close() { box.hidden = true; inner.replaceChildren(); document.body.style.overflow = ""; }
  document.getElementById("main").addEventListener("click", e => {
    if (e.target.tagName === "IMG") open(e.target);
  });
  document.getElementById("zoom-prev").onclick = () => step(-1);
  document.getElementById("zoom-next").onclick = () => step(1);
  document.getElementById("zoom-close").onclick = close;
  // Drag to pan; a click on the backdrop without a drag closes.
  let drag = null;
  view.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: view.scrollLeft, t: view.scrollTop, moved: false, on: e.target };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; view.classList.add("dragging"); }
    view.scrollLeft = drag.l - dx; view.scrollTop = drag.t - dy;
  });
  view.addEventListener("pointerup", e => {
    const d = drag; drag = null; view.classList.remove("dragging");
    if (d && !d.moved && (d.on === view || d.on === inner)) close();
  });
  addEventListener("resize", () => { if (!box.hidden && level === "fit") show(); });
  document.addEventListener("keydown", e => {
    if (box.hidden) return;
    e.stopImmediatePropagation();
    const i = LEVELS.findIndex(([v]) => v === level);
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "+" || e.key === "=") set(LEVELS[Math.min(LEVELS.length - 1, Math.max(1, i + 1))][0]);
    else if (e.key === "-") set(i <= 1 ? "fit" : LEVELS[i - 1][0]);
    else if (e.key === "0") set("fit");
  }, true);
  return { open, close };
})();

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const cycle = (key, list) => { if (!list.length) return; const i = list.indexOf(state[key]); state[key] = list[(i + (e.shiftKey ? list.length - 1 : 1)) % list.length]; save(); render(); };
  if (e.key === "t") cycle("theme", DATA.themes);
  if (e.key === "r") cycle("radius", DATA.radii.map(String));
  if (e.key === "s") cycle("section", ["all", ...DATA.sections]);
  if (e.key === "v") cycle("mode", MODES.map(m => m[0]));
  if (e.key === "a") cycle("against", OTHERS.map(b => b.name));
  if (e.key === "A") cycle("tagainst", TOTHERS.map(b => b.name));
});

render();
</script>
</body>
</html>
